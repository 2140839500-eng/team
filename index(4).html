<style>
  :root {

  }

  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .confetti-layer { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 40; }

  }

  @keyframes fall {
    to { transform: translateY(105vh) rotate(560deg); opacity: 0; }
  }
</style>

  <script>
  (function () {
    'use strict';

    var STORE_KEY = 'days_matter_events_v1';

    var EMOJIS = ['🎯', '🎂', '❤️', '🎓', '✈️', '🏠', '💍', '📚', '🎄', '🏆', '👶', '🎁'];
    var COLORS = ['#7c9cf5', '#f5a3c0', '#8fd3b6', '#f0b76a', '#b39df0', '#7fc8e8'];

    var nameInput = document.getElementById('name');
    var dateInput = document.getElementById('date');
    var emojiRow = document.getElementById('emojiRow');
    var typeRow = document.getElementById('typeRow');
    var addBtn = document.getElementById('addBtn');
    var panel = document.getElementById('panel');
    var grid = document.getElementById('grid');
    var empty = document.getElementById('empty');
    var emptyText = document.getElementById('emptyText');
    var filtersEl = document.getElementById('filters');
    var cleanBtn = document.getElementById('cleanBtn');
    var banner = document.getElementById('banner');
    var notifyBtn = document.getElementById('notifyBtn');
    var sub = document.getElementById('sub');
    var toast = document.getElementById('toast');
    var confettiLayer = document.getElementById('confettiLayer');
    var editTip = document.getElementById('editTip');
    var editName = document.getElementById('editName');
    var cancelEdit = document.getElementById('cancelEdit');

    var events = [];
    var filter = 'all';
    var pickedEmoji = '🎯';
    var editingId = null;
    var timerId = null;

    /* ---------- 日期工具 ---------- */
    function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

    function parseDate(s) {
      var p = s.split('-');
      return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    }

    function daysBetween(a, b) {
      return Math.round((startOfDay(b) - startOfDay(a)) / 86400000);
    }

    function fmtDate(d) {
      return (d.getMonth() + 1) + '月' + d.getDate() + '日';
    }

    function fmtFull(s) {
      var d = parseDate(s);
      return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
    }

    /* ---------- 存取 ---------- */
    function load() {
      try {
        var raw = localStorage.getItem(STORE_KEY);
        if (!raw) return [];
        var data = JSON.parse(raw);
        if (!Array.isArray(data)) return [];
        return data.filter(function (e) {
          return e && typeof e.name === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(e.date || '');
        });
      } catch (err) { return []; }
    }

    function save() {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(events)); } catch (err) { /* 忽略 */ }
    }

    /* ---------- 事件计算 ---------- */
    function isToday(e, now) {
      var t = parseDate(e.date);
      if (e.type === 'yearly') return t.getMonth() === now.getMonth() && t.getDate() === now.getDate();
      return daysBetween(now, t) === 0;
    }

    function nextOccur(e, now) {
      var t = parseDate(e.date);
      if (e.type !== 'yearly') return t;
      var c = new Date(now.getFullYear(), t.getMonth(), t.getDate());
      if (daysBetween(now, c) < 0) c = new Date(now.getFullYear() + 1, t.getMonth(), t.getDate());
      return c;
    }

    function calc(e, now) {
      var t = parseDate(e.date);
      var info = { target: t, today: isToday(e, now) };
      if (e.type === 'yearly') {
        var next = nextOccur(e, now);
        var prev = new Date(next.getFullYear() - 1, next.getMonth(), next.getDate());
        info.daysToNext = daysBetween(now, next);
        info.already = Math.max(0, daysBetween(t, now));
        info.progress = info.daysToNext === 0 ? 1
          : Math.max(0, Math.min(1, daysBetween(prev, now) / daysBetween(prev, next)));
        info.sortKey = next.getTime();
        info.dateText = '每年 ' + fmtDate(t) + ' · 已 ' + info.already + ' 天';
      } else {
        info.daysLeft = daysBetween(now, t);
        info.past = info.daysLeft < 0;
        var span = t.getTime() - (e.createdAt || now.getTime());
        info.progress = info.daysLeft <= 0 ? 1
          : Math.max(0, Math.min(1, (now.getTime() - (e.createdAt || now.getTime())) / (span || 1)));
        info.sortKey = info.past ? t.getTime() + 1e15 : t.getTime();
        info.dateText = fmtFull(e.date) + (info.past ? ' · 已过' : '');
      }
      return info;
    }

    /* ---------- 渲染 ---------- */
    function visible() {
      return events
        .map(function (e) { return { e: e, info: calc(e, new Date()) }; })
        .filter(function (o) { return filter === 'all' || o.e.type === filter; })
        .sort(function (a, b) { return a.info.sortKey - b.info.sortKey; });
    }

    function render() {
      var now = new Date();
      var items = visible();
      grid.innerHTML = '';
      var expired = 0;

      items.forEach(function (o) {
        if (o.e.type === 'once' && o.info.past) expired++;
        grid.appendChild(buildCard(o.e, o.info));
      });

      events.forEach(function (e) {
        if (e.type === 'once' && calc(e, now).past) expired++;
      });

      if (items.length === 0) {
        empty.classList.remove('hidden');
        emptyText.textContent = events.length === 0
          ? '还没有记录，添加第一个重要的日子吧'
          : '这个分类下还没有记录';
      } else {
        empty.classList.add('hidden');
      }

      cleanBtn.disabled = expired === 0;
      renderSub(now);
    }

    function renderSub(now) {
      var upcoming = events
        .map(function (e) { return { e: e, info: calc(e, now) }; })
        .filter(function (o) { return !o.info.past; })
        .sort(function (a, b) { return a.info.sortKey - b.info.sortKey; });

      if (events.length === 0) { sub.textContent = '生日、考试、纪念日……把重要的日子都记在这里'; return; }

      var todayCount = upcoming.filter(function (o) { return o.info.today; }).length;
      if (todayCount > 0) {
        sub.textContent = '今天有 ' + todayCount + ' 个重要的日子！🎉';
        return;
      }
      if (upcoming.length === 0) { sub.textContent = '共 ' + events.length + ' 个记录'; return; }
      var n = upcoming[0];
      sub.textContent = '最近的：「' + n.e.name + '」还有 ' +
        (n.e.type === 'yearly' ? n.info.daysToNext : n.info.daysLeft) + ' 天';
    }

    function buildCard(e, info) {
      var li = document.createElement('article');
      li.className = 'card' + (info.today ? ' today' : '');
      li.style.setProperty('--c', e.color || '#7c9cf5');
      li.title = '点击编辑这条记录';

      var head = document.createElement('div');
      head.className = 'card-head';

      var em = document.createElement('span');
      em.className = 'card-emoji';
      em.textContent = e.emoji || '🎯';

      var title = document.createElement('div');
      title.className = 'card-title';
      title.textContent = e.name;

      var del = document.createElement('button');
      del.className = 'btn-del';
      del.type = 'button';
      del.textContent = '✕';
      del.title = '删除';
      del.addEventListener('click', function (ev) { ev.stopPropagation(); remove(e.id, li); });

      head.appendChild(em);
      head.appendChild(title);
      head.appendChild(del);

      var big = document.createElement('div');
      big.className = 'big';
      if (info.today) {
        big.textContent = e.type === 'yearly' ? '周年快乐' : '就是今天';
      } else if (e.type === 'yearly') {
        big.innerHTML = info.daysToNext + '<small>天后周年</small>';
      } else if (info.past) {
        big.innerHTML = (-info.daysLeft) + '<small>天前</small>';
      } else {
        big.innerHTML = info.daysLeft + '<small>天后</small>';
      }

      var meta = document.createElement('div');
      meta.className = 'card-meta';
      var badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = e.type === 'yearly' ? '纪念日' : '倒计时';
      meta.appendChild(badge);
      meta.appendChild(document.createTextNode(info.dateText));

      var bar = document.createElement('div');
      bar.className = 'bar';
      var fill = document.createElement('i');
      fill.style.width = Math.round(info.progress * 100) + '%';
      bar.appendChild(fill);

      li.appendChild(head);
      li.appendChild(big);
      li.appendChild(meta);
      li.appendChild(bar);

      li.addEventListener('click', function () { startEdit(e.id); });
      return li;
    }

    /* ---------- 表单 ---------- */
    function buildEmojiRow() {
      EMOJIS.forEach(function (em, i) {
        var b = document.createElement('button');
        b.type = 'button';
        b.textContent = em;
        if (em === pickedEmoji) b.classList.add('active');
        b.addEventListener('click', function () {
          pickedEmoji = em;
          Array.prototype.forEach.call(emojiRow.children, function (c) {
            c.classList.toggle('active', c === b);
          });
        });
        emojiRow.appendChild(b);
      });
    }

    function pickedType() {
      var checked = typeRow.querySelector('input:checked');
      return checked ? checked.value : 'once';
    }

    function setType(v) {
      Array.prototype.forEach.call(typeRow.querySelectorAll('label'), function (l) {
        l.classList.toggle('active', l.dataset.v === v);
        l.querySelector('input').checked = l.dataset.v === v;
      });
    }

    function shakeForm() {
      panel.classList.remove('shake');
      void panel.offsetWidth;
      panel.classList.add('shake');
    }

    function submit() {
      var name = nameInput.value.trim();
      var date = dateInput.value;
      if (!name) { toastMsg('先给事件起个名字吧'); shakeForm(); nameInput.focus(); return; }
      if (!date) { toastMsg('选一个日期'); shakeForm(); dateInput.focus(); return; }

      if (editingId) {
        events = events.map(function (e) {
          return e.id === editingId
            ? { id: e.id, name: name, date: date, type: pickedType(), emoji: pickedEmoji, color: e.color, createdAt: e.createdAt }
            : e;
        });
        toastMsg('已修改');
        exitEdit();
      } else {
        events.push({
          id: String(Date.now()) + Math.random().toString(36).slice(2, 7),
          name: name,
          date: date,
          type: pickedType(),
          emoji: pickedEmoji,
          color: COLORS[events.length % COLORS.length],
          createdAt: Date.now()
        });
        toastMsg('已添加「' + name + '」');
      }

      save();
      nameInput.value = '';
      render();
      checkReminders(true);
    }

    /* ---------- 编辑 / 删除 ---------- */
    function startEdit(id) {
      var e = null;
      events.forEach(function (x) { if (x.id === id) e = x; });
      if (!e) return;
      editingId = id;
      nameInput.value = e.name;
      dateInput.value = e.date;
      pickedEmoji = e.emoji || '🎯';
      Array.prototype.forEach.call(emojiRow.children, function (c, i) {
        c.classList.toggle('active', EMOJIS[i] === pickedEmoji);
      });
      setType(e.type);
      editName.textContent = e.name;
      editTip.classList.remove('hidden');
      addBtn.textContent = '保存修改';
      nameInput.focus();
      panel.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function exitEdit() {
      editingId = null;
      editTip.classList.add('hidden');
      addBtn.textContent = '添加';
    }

    function remove(id, cardEl) {
      if (editingId === id) exitEdit();
      if (cardEl) cardEl.classList.add('leaving');
      events = events.filter(function (e) { return e.id !== id; });
      save();
      setTimeout(render, cardEl ? 200 : 0);
    }

    function cleanExpired() {
      var now = new Date();
      var gone = events.filter(function (e) {
        return e.type === 'once' && calc(e, now).past;
      });
      if (gone.length === 0) return;
      if (!window.confirm('确定要清除 ' + gone.length + ' 条已过期的倒计时吗？')) return;
      var ids = gone.map(function (e) { return e.id; });
      events = events.filter(function (e) { return ids.indexOf(e.id) < 0; });
      save();
      render();
      toastMsg('已清除 ' + gone.length + ' 条过期记录');
    }

    /* ---------- 当天提醒 ---------- */
    function todayKey() {
      var d = new Date();
      return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
    }

    function showBanner(list) {
      banner.textContent = '🎉 今天：' + list.map(function (o) { return '「' + o.e.name + '」'; }).join('、');
      banner.classList.remove('hidden');
    }

    function confetti() {
      var pieces = ['🎉', '✨', '💜', '⭐', '🎊', '🎈'];
      for (var i = 0; i < 26; i++) {
        (function (i) {
          var span = document.createElement('span');
          span.className = 'confetti-piece';
          span.textContent = pieces[Math.floor(Math.random() * pieces.length)];
          span.style.left = Math.random() * 100 + 'vw';
          span.style.fontSize = (14 + Math.random() * 14) + 'px';
          span.style.animationDuration = (2 + Math.random() * 1.6) + 's';
          span.style.animationDelay = (Math.random() * 0.6) + 's';
          confettiLayer.appendChild(span);
          setTimeout(function () {
            if (span.parentNode) span.parentNode.removeChild(span);
          }, 4600);
        })(i);
      }
    }

    function checkReminders(allowConfetti) {
      var now = new Date();
      var list = events
        .map(function (e) { return { e: e, info: calc(e, now) }; })
        .filter(function (o) { return o.info.today; });

      if (list.length === 0) { banner.classList.add('hidden'); return; }

      showBanner(list);
      if (allowConfetti) confetti();

      /* 浏览器通知：每天每条只提醒一次 */
      if ('Notification' in window && Notification.permission === 'granted') {
        var key = 'days_matter_notified_' + todayKey();
        var done = [];
        try { done = JSON.parse(localStorage.getItem(key) || '[]'); } catch (err) { done = []; }
        if (!Array.isArray(done)) done = [];
        list.forEach(function (o) {
          if (done.indexOf(o.e.id) >= 0) return;
          try {
            new Notification('⏰ 今天是「' + o.e.name + '」', {
              body: o.e.type === 'yearly' ? '周年纪念日快乐！' : '你倒数的日子到了！',
              tag: o.e.id
            });
            done.push(o.e.id);
          } catch (err) { /* 忽略 */ }
        });
        try { localStorage.setItem(key, JSON.stringify(done)); } catch (err) { /* 忽略 */ }
      }
    }

    function syncNotifyBtn() {
      if (!('Notification' in window)) {
        notifyBtn.textContent = '🔔 此浏览器不支持提醒';
        notifyBtn.classList.add('on');
        notifyBtn.disabled = true;
        return;
      }
      if (Notification.permission === 'granted') {
        notifyBtn.textContent = '🔔 当天提醒已开启';
        notifyBtn.classList.add('on');
      } else if (Notification.permission === 'denied') {
        notifyBtn.textContent = '🔔 提醒被浏览器拦截';
      }
    }

    notifyBtn.addEventListener('click', function () {
      if (!('Notification' in window)) return;
      if (Notification.permission === 'granted') { toastMsg('提醒已经是开启状态'); return; }
      Notification.requestPermission().then(function (p) {
        syncNotifyBtn();
        if (p === 'granted') {
          toastMsg('好嘞，重要日子当天会提醒你');
          try { new Notification('🔔 提醒已开启', { body: '重要日子当天见！' }); } catch (err) { /* 忽略 */ }
          checkReminders(true);
        }
      });
    });

    /* ---------- 小工具 ---------- */
    function toastMsg(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(function () { toast.classList.remove('show'); }, 2200);
    }

    /* ---------- 事件绑定 ---------- */
    addBtn.addEventListener('click', submit);
    nameInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
    cleanBtn.addEventListener('click', cleanExpired);
    cancelEdit.addEventListener('click', function () { exitEdit(); nameInput.value = ''; });

    filtersEl.addEventListener('click', function (e) {
      var btn = e.target.closest('button');
      if (!btn || !btn.dataset.f) return;
      filter = btn.dataset.f;
      Array.prototype.forEach.call(filtersEl.querySelectorAll('button'), function (b) {
        b.classList.toggle('active', b === btn);
      });
      render();
    });

    typeRow.addEventListener('click', function (e) {
      var label = e.target.closest('label');
      if (label) setType(label.dataset.v);
    });

    /* ---------- 启动 ---------- */
    events = load();
    buildEmojiRow();
    render();
    syncNotifyBtn();
    checkReminders(true);
    timerId = setInterval(function () { checkReminders(false); }, 60000);
  })();
  </script>
</body>
</html>
